services:
  - type: web
    name: news-ai-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://news-ai-platform-abze.onrender.com
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: GROQ_API_KEY
        sync: false
